name: Publish SuitMaster RC2

on:
  push:
    paths:
      - '.github/workflows/publish-suitmaster-rc2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build standalone RC2 from verified RC1
        shell: python
        run: |
          from pathlib import Path

          src = Path("SuitMaster/JCS_SuitMaster_RC1(3).py")
          dst = Path("SuitMaster/JCS_SuitMaster_RC2.py")
          text = src.read_text(encoding="utf-8")

          text = text.replace(
              "# RELEASE CANDIDATE 1 - PUBLIC TEST BUILD",
              "# RELEASE CANDIDATE 2 - PUBLIC TEST BUILD",
              1,
          )
          text = text.replace('VERSION = "RC1"', 'VERSION = "RC2"', 1)

          start = text.index("def classify_slot(item, opl):")
          end = text.index("# ============================================================\n# Race compatibility", start)

          replacement = '''def classify_slot(item, opl):
              # Slot safety rule:
              #   1) known shard artifact names
              #   2) Legion's actual equipment layer
              #   3) conservative ITEM-NAME fallback only
              # Never use the full OPL/tooltip to infer a slot; property text can contain
              # unrelated words and cause a perfectly valid item to be assigned elsewhere.
              layer = item_layer(item).lower().replace(" ", "")
              name = item_name(item).lower().strip()

              # Narrow InsaneUO artifact exceptions whose real wearable layer is known.
              # Keep these exact/specific; do not use broad words such as "wing" here.
              if "tunic of vigor" in name:
                  return "Sash"
              if "dragon's wing" in name or "dragons wing" in name:
                  return "Back"
              if "epaulette" in name:
                  return "Robe"

              # Prefer Legion's reported wearable layer whenever it is recognizable.
              layer_map = {
                  "head": "Head",
                  "helmet": "Head",
                  "neck": "Neck",
                  "gloves": "Hands",
                  "hands": "Hands",
                  "arms": "Arms",
                  "outertorso": "Robe",
                  "robe": "Robe",
                  "cloak": "Back",
                  "earrings": "Earrings",
                  "earring": "Earrings",
                  "waist": "Belt",
                  "middletorso": "Chest",
                  "innertorso": "Chest",
                  "shirt": "Chest",
                  "outerlegs": "Legs",
                  "innerlegs": "Legs",
                  "pants": "Legs",
                  "ring": "Ring",
                  "bracelet": "Bracelet",
                  "talisman": "Talisman",
              }
              for key, slot in layer_map.items():
                  if key in layer:
                      return slot

              # Shields may expose only a generic hand layer, so use a conservative
              # item-name check after trying the real layer.
              shield_words = (
                  "shield", "buckler", "heater shield", "kite shield",
                  "wooden shield", "metal shield", "order shield", "chaos shield"
              )
              if any(x in name for x in shield_words):
                  return "Shield"

              # Conservative name-only fallbacks for items whose layer is unavailable.
              if "bracelet" in name:
                  return "Bracelet"
              if re.search(r"\\bring\\b", name):
                  return "Ring"
              if "talisman" in name:
                  return "Talisman"
              if "earring" in name:
                  return "Earrings"
              if "sash" in name:
                  return "Sash"
              if "belt" in name or "cincture" in name:
                  return "Belt"
              if "cloak" in name:
                  return "Back"
              if "robe" in name:
                  return "Robe"

              # Armor fallbacks. Head is checked before any broad torso wording so names
              # such as "Winged Helm" can never become Back gear.
              if any(x in name for x in ("helmet", "helm", "cap", "hat", "cowl", "circlet")):
                  return "Head"
              if "gorget" in name:
                  return "Neck"
              if any(x in name for x in ("gloves", "gauntlets", "mitts")):
                  return "Hands"
              if any(x in name for x in ("sleeves", "arm guards", "arm armor", "arm armour")):
                  return "Arms"
              if any(x in name for x in ("leggings", "leg armor", "leg armour", "pants", "kilt")):
                  return "Legs"
              if any(x in name for x in (
                  "tunic", "chest", "breastplate", "armor", "armour", "jacket", "shirt"
              )):
                  return "Chest"

              # Unknown/ambiguous equipment is safer to ignore than to put in a wrong slot.
              return None


          '''
          # Remove the indentation introduced by the YAML/Python block while preserving
          # the function's intended Python indentation.
          import textwrap
          replacement = textwrap.dedent(replacement)
          text = text[:start] + replacement + text[end:]
          dst.write_text(text, encoding="utf-8")

          note = '''# SuitMaster RC2 Fix Note

RC2 fixes equipment-slot classification.

- Legion's reported equipment layer is now preferred whenever available.
- Fallback slot detection now uses only the actual item name, not tooltip/OPL property text.
- Removed the broad `wing = Back` fallback that could classify a **Winged Helm** as back-slot gear.
- Known back-slot artifacts such as **Dragon's Wing** remain supported explicitly.
- Ambiguous/unrecognized equipment is ignored instead of being forced into the wrong slot.
- Hit Point Regeneration and Stamina Regeneration remain supported build properties.

This is a full standalone script. No loader or payload files are required.
'''
          Path("SuitMaster/RC2-Fix-Note.md").write_text(note, encoding="utf-8")

      - name: Validate RC2
        run: python -m py_compile SuitMaster/JCS_SuitMaster_RC2.py

      - name: Commit RC2
        run: |
          git config user.name "JCS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SuitMaster/JCS_SuitMaster_RC2.py SuitMaster/RC2-Fix-Note.md
          git commit -m "Publish SuitMaster RC2 slot classification fix"
          git push
