name: Build Artisan Beta2
on:
  push:
    branches: [build-artisan-beta2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone file
        shell: bash
        env:
          PATCH_B64: 
        run: |
          cp Artisan-Workshop/JCS_ArtisanWorkshop_Beta1.py /tmp/JCS_ArtisanWorkshop_Beta2.py
          echo "$PATCH_B64" | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py
          python -m py_compile /tmp/JCS_ArtisanWorkshop_Beta2.py || true
          nl -ba /tmp/JCS_ArtisanWorkshop_Beta2.py | sed -n '2588,2608p'
          wc -c /tmp/JCS_ArtisanWorkshop_Beta2.py
      - uses: actions/upload-artifact@v4
        with:
          name: artisan-beta2
          path: /tmp/JCS_ArtisanWorkshop_Beta2.py
          if-no-files-found: error
