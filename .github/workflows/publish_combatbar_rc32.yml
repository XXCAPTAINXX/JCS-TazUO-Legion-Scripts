name: Publish Combat Bar RC32

# final exact-match publish
on:
  push:
    paths:
      - '.github/workflows/publish_combatbar_rc32.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and publish exact Combat Bar RC32
        shell: bash
        run: |
          set -euo pipefail
          OUT='Ultimate-Combat-Bar/v1.6-RC32/JCS_CombatBar_RC32_CS1.py'
          mkdir -p Ultimate-Combat-Bar/v1.6-RC32
          cat \
            .publish_tmp/combat_rc32_c00a.b64 \
            .publish_tmp/combat_rc32_c00b.b64 \
            .publish_tmp/combat_rc32_c00c.b64 \
            .publish_tmp/combat_rc32_c00d.b64 \
            .publish_tmp/combat_rc32_c01a.b64 \
            .publish_tmp/combat_rc32_c01b.b64 \
            .publish_tmp/combat_rc32_02.b64 \
            .publish_tmp/combat_rc32_03.b64 \
            .publish_tmp/combat_rc32_04.b64 \
            .publish_tmp/combat_rc32_05.b64 \
            .publish_tmp/combat_rc32_06.b64 \
            .publish_tmp/combat_rc32_07.b64 \
            .publish_tmp/combat_rc32_08.b64 \
            .publish_tmp/combat_rc32_c09a.b64 \
            .publish_tmp/combat_rc32_c09b.b64 \
            .publish_tmp/combat_rc32_10.b64 \
            .publish_tmp/combat_rc32_11.b64 \
            .publish_tmp/combat_rc32_12.b64 \
            .publish_tmp/combat_rc32_13.b64 \
            .publish_tmp/combat_rc32_14.b64 \
            | base64 -d > "$OUT"
          python - <<'PY'
          p='Ultimate-Combat-Bar/v1.6-RC32/JCS_CombatBar_RC32_CS1.py'
          d=open(p,'rb').read()
          if d.startswith(b'\xef\xbb\xbf'):
              open(p,'wb').write(d[3:])
          PY
          test "$(wc -c < "$OUT")" -eq 101304
          test "$(sha256sum "$OUT" | cut -d' ' -f1)" = '354d01c7bf5a7882875ca2daa8e63a3001b498d49c186310f4581eec3e6be6ab'
          python -m py_compile "$OUT"
          rm -rf Ultimate-Combat-Bar/v1.6-RC32/__pycache__
          rm -f .publish_tmp/combat_rc32_*.b64
          rm -f .github/workflows/publish_combatbar_rc32.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Combat Bar v1.6-RC32 CS1"
          git push
