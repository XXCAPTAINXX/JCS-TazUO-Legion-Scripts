name: Publish Combat Bar RC32

# diagnostic rebuild before final publish
on:
  push:
    paths:
      - '.github/workflows/publish_combatbar_rc32.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose reconstructed Combat Bar RC32
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Ultimate-Combat-Bar/v1.6-RC32
          cat \
            .publish_tmp/combat_rc32_c00a.b64 \
            .publish_tmp/combat_rc32_c00b.b64 \
            .publish_tmp/combat_rc32_c00c.b64 \
            .publish_tmp/combat_rc32_c00d.b64 \
            .publish_tmp/combat_rc32_c01a.b64 \
            .publish_tmp/combat_rc32_c01b.b64 \
            .publish_tmp/combat_rc32_02.b64 \
            .publish_tmp/combat_rc32_03.b64 \
            .publish_tmp/combat_rc32_04.b64 \
            .publish_tmp/combat_rc32_05.b64 \
            .publish_tmp/combat_rc32_06.b64 \
            .publish_tmp/combat_rc32_07.b64 \
            .publish_tmp/combat_rc32_08.b64 \
            .publish_tmp/combat_rc32_c09a.b64 \
            .publish_tmp/combat_rc32_c09b.b64 \
            .publish_tmp/combat_rc32_10.b64 \
            .publish_tmp/combat_rc32_11.b64 \
            .publish_tmp/combat_rc32_12.b64 \
            .publish_tmp/combat_rc32_13.b64 \
            .publish_tmp/combat_rc32_14.b64 \
            | base64 -d > Ultimate-Combat-Bar/v1.6-RC32/JCS_CombatBar_RC32_CS1.py
          echo "SIZE=$(wc -c < Ultimate-Combat-Bar/v1.6-RC32/JCS_CombatBar_RC32_CS1.py)"
          echo "SHA256=$(sha256sum Ultimate-Combat-Bar/v1.6-RC32/JCS_CombatBar_RC32_CS1.py | cut -d' ' -f1)"
          python -m py_compile Ultimate-Combat-Bar/v1.6-RC32/JCS_CombatBar_RC32_CS1.py
