name: Finalize Lootmaster RC1

on:
  push:
    paths:
      - '.lootmaster-finalize-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact RC1 source
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          root = Path('Lootmaster-Reforged')
          parts = [
              root / '.JCS_Lootmaster_Reforged.rc1.001',
              root / '.JCS_Lootmaster_Reforged.rc1.002',
              root / '.JCS_Lootmaster_Reforged.rc1.003',
          ]
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          source = gzip.decompress(base64.b64decode(encoded))

          expected_size = 104208
          expected_sha = '634d838d985039242c432352a693002c8042cdc09fc2e0e5965c8832e33d8e04'
          actual_sha = hashlib.sha256(source).hexdigest()

          if len(source) != expected_size:
              raise SystemExit(f'Unexpected size: {len(source)}')
          if actual_sha != expected_sha:
              raise SystemExit(f'SHA-256 mismatch: {actual_sha}')

          (root / 'JCS_Lootmaster_Reforged.py').write_bytes(source)

      - name: Remove payload workaround and commit readable source
        shell: bash
        run: |
          rm -f Lootmaster-Reforged/.JCS_Lootmaster_Reforged.rc1.001
          rm -f Lootmaster-Reforged/.JCS_Lootmaster_Reforged.rc1.002
          rm -f Lootmaster-Reforged/.JCS_Lootmaster_Reforged.rc1.003
          rm -f .lootmaster-finalize-trigger
          rm -f .github/workflows/finalize-lootmaster-rc1.yml

          git config user.name 'JCS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Lootmaster RC1 loader with readable source'
          git push origin HEAD:main
